name: decp_mobile
description: DECP - Department Engagement & Career Platform Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  go_router: ^13.2.5
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  timeago: ^3.6.1
  socket_io_client: ^2.0.3+1
  cupertino_icons: ^1.0.6
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  badges: ^3.1.2
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^4.0.0
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.1.2
  fluttertoast: ^8.2.8
  http_parser: ^4.0.2
  mime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
