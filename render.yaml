# Render.com Free Deployment Configuration
# Deploy the DECP Platform for free using Render.com
# See: https://render.com/docs/blueprint-spec
#
# NOTE: All paths are relative to the REPOSITORY ROOT (where this file lives).
# Services are under: code/Mini Project/decp-platform/backend/<service>/

services:
  # ─── Frontend (Static Site - Free) ───────────────────────────────────────
  - type: web
    name: decp-frontend
    runtime: static
    buildCommand: cd "code/Mini Project/decp-platform/frontend" && npm ci && npm run build
    staticPublishPath: code/Mini Project/decp-platform/frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false

  # ─── API Gateway ──────────────────────────────────────────────────────────
  - type: web
    name: decp-api-gateway
    runtime: docker
    dockerfilePath: ./code/Mini Project/decp-platform/backend/api-gateway/Dockerfile
    dockerContext: ./code/Mini Project/decp-platform/backend/api-gateway
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: AUTH_SERVICE_URL
        fromService:
          name: decp-auth-service
          type: web
          property: hostport
      - key: USER_SERVICE_URL
        fromService:
          name: decp-user-service
          type: web
          property: hostport
      - key: FEED_SERVICE_URL
        fromService:
          name: decp-feed-service
          type: web
          property: hostport
      - key: JOBS_SERVICE_URL
        fromService:
          name: decp-jobs-service
          type: web
          property: hostport
      - key: EVENTS_SERVICE_URL
        fromService:
          name: decp-events-service
          type: web
          property: hostport
      - key: RESEARCH_SERVICE_URL
        fromService:
          name: decp-research-service
          type: web
          property: hostport
      - key: MESSAGING_SERVICE_URL
        fromService:
          name: decp-messaging-service
          type: web
          property: hostport
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: decp-notification-service
          type: web
          property: hostport
      - key: ANALYTICS_SERVICE_URL
        fromService:
          name: decp-analytics-service
          type: web
          property: hostport

  # ─── Auth Service ─────────────────────────────────────────────────────────
  - type: web
    name: decp-auth-service
    runtime: docker
    dockerfilePath: ./code/Mini Project/decp-platform/backend/auth-service/Dockerfile
    dockerContext: ./code/Mini Project/decp-platform/backend/auth-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_HOST
        fromDatabase:
          name: decp-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: decp-postgres
          property: port
      - key: DB_NAME
        value: decp_auth
      - key: DB_USER
        fromDatabase:
          name: decp-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: decp-postgres
          property: password
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

  # ─── User Service ─────────────────────────────────────────────────────────
  - type: web
    name: decp-user-service
    runtime: docker
    dockerfilePath: ./code/Mini Project/decp-platform/backend/user-service/Dockerfile
