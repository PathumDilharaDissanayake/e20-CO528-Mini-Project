# DECP Platform — Deploy Frontend to GitHub Pages (Free)
name: Deploy Frontend → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'code/Mini Project/decp-platform/frontend/**'
      - '.github/workflows/deploy-frontend-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'code/Mini Project/decp-platform/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: 'code/Mini Project/decp-platform/frontend'
        run: npm ci

      - name: Build
        working-directory: 'code/Mini Project/decp-platform/frontend'
        run: npm run build
        env:
          # GitHub Pages serves at /e20-CO528-Mini-Project/
          VITE_BASE_URL: /e20-CO528-Mini-Project/
          # Point to deployed backend (update this once backend is deployed)
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://decp-api-gateway.onrender.com/api/v1' }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || 'https://decp-messaging-service.onrender.com' }}

      - name: Add 404.html for SPA routing
        run: |
          cp "code/Mini Project/decp-platform/frontend/dist/index.html" \
             "code/Mini Project/decp-platform/frontend/dist/404.html"

      - name: Add .nojekyll (prevents Jekyll processing)
        run: touch "code/Mini Project/decp-platform/frontend/dist/.nojekyll"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 'code/Mini Project/decp-platform/frontend/dist'
          commit_message: 'deploy: frontend build ${{ github.sha }}'
          force_orphan: true
